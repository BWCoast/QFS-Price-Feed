<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QFS Token Price Feed</title>
<link rel="icon" type="image/png" href="qfs.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --qfs-gold:#D1B47B;--qfs-green:#7AA7A0;--qfs-charcoal:#4E4E4E;--qfs-neutral:#B4B4B4;--qfs-light:#F1F1F1;
  --qfs-gradient:linear-gradient(135deg,#D1B47B,#7AA7A0);
  --font-heading:'Josefin Sans',sans-serif;--font-body:'Libre Baskerville','Georgia',serif;
  --bg-page:#111;--bg-card:#1E1E1E;--bg-card-hover:#252525;--border-card:#333;--border-subtle:#2a2a2a;
  --text-primary:var(--qfs-light);--text-secondary:var(--qfs-neutral);--text-muted:var(--qfs-charcoal);
  --bg-header:rgba(17,17,17,.95);--bg-summary:#1a1a1a;--bg-toast:#2a2a2a;
  --shadow-card:0 2px 12px rgba(0,0,0,.5);--shadow-glow:0 0 20px rgba(209,180,123,.1);
  --chart-grid:rgba(255,255,255,.06);--loader-bg:#111;--toggle-bg:#333;--toggle-fg:var(--qfs-gold);
  --positive:#2ECC71;--negative:#E74C3C;
}
[data-theme="light"]{
  --bg-page:var(--qfs-light);--bg-card:#FFF;--bg-card-hover:#FAFAF8;--border-card:#D8D0C4;--border-subtle:#E4DDD3;
  --text-primary:#2A2A2A;--text-secondary:var(--qfs-charcoal);--text-muted:var(--qfs-neutral);
  --bg-header:rgba(241,241,241,.95);--bg-summary:#E8E4DE;--bg-toast:#FFF;
  --shadow-card:0 2px 12px rgba(0,0,0,.08);--shadow-glow:0 0 20px rgba(209,180,123,.15);
  --chart-grid:rgba(0,0,0,.06);--loader-bg:var(--qfs-light);--toggle-bg:#D8D0C4;--toggle-fg:var(--qfs-green);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-body);background:var(--bg-page);color:var(--text-primary);min-height:100vh;transition:background .4s,color .4s}

#loader{position:fixed;inset:0;z-index:9999;background:var(--loader-bg);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .5s}
#loader.hidden{opacity:0;pointer-events:none}
.loader-logo{width:64px;height:64px;border-radius:50%;object-fit:contain;margin-bottom:1rem}
.loader-title{font-family:var(--font-heading);font-size:1.5rem;font-weight:700;letter-spacing:.1em;background:var(--qfs-gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:.75rem}
.loader-spinner{width:36px;height:36px;border:3px solid var(--border-card);border-top-color:var(--qfs-gold);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loader-sub{font-family:var(--font-body);color:var(--text-muted);font-size:.8rem;margin-top:.75rem;font-style:italic}

.header{position:sticky;top:0;z-index:100;background:var(--bg-header);backdrop-filter:blur(12px);border-bottom:1px solid var(--border-card);padding:.65rem 1.25rem;display:flex;align-items:center;justify-content:space-between;transition:background .4s}
.header-left{display:flex;align-items:center;gap:.65rem}
.header-logo{width:36px;height:36px;border-radius:50%;object-fit:contain}
.header-title{font-family:var(--font-heading);font-size:1.4rem;font-weight:700;color:var(--qfs-gold);letter-spacing:.08em;text-transform:uppercase}
.header-sub{font-family:var(--font-body);font-size:.65rem;color:var(--text-muted);font-style:italic}
.header-right{display:flex;align-items:center;gap:.6rem}

.btn-sm{font-family:var(--font-heading);font-size:.65rem;font-weight:600;padding:.3rem .65rem;border-radius:6px;border:1px solid var(--border-card);background:transparent;color:var(--text-secondary);cursor:pointer;transition:all .2s;text-transform:uppercase;letter-spacing:.06em}
.btn-sm:hover{border-color:var(--qfs-gold);color:var(--qfs-gold)}
.btn-sm.active{background:rgba(209,180,123,.15);color:var(--qfs-gold);border-color:var(--qfs-gold)}

.theme-toggle{width:44px;height:24px;border-radius:12px;background:var(--toggle-bg);border:1px solid var(--border-card);cursor:pointer;position:relative;transition:background .3s;flex-shrink:0}
.theme-toggle::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--toggle-fg);transition:transform .3s,background .3s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
[data-theme="light"] .theme-toggle::after{transform:translateX(20px)}
.theme-icon{position:absolute;top:50%;transform:translateY(-50%);font-size:.6rem;pointer-events:none;z-index:1}
.theme-icon.sun{right:4px}.theme-icon.moon{left:5px}

.conn-dot{width:8px;height:8px;border-radius:50%;background:#666;flex-shrink:0;transition:background .3s}
.conn-dot.live{background:var(--positive);box-shadow:0 0 6px rgba(46,204,113,.6)}
.conn-dot.connecting{background:#F1C40F;animation:pulse-dot 1.5s infinite}
.conn-dot.rest{background:var(--negative)}
@keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:.4}}

.summary-bar{background:var(--bg-summary);border-bottom:1px solid var(--border-card);padding:.5rem 1.25rem;display:flex;align-items:center;justify-content:center;gap:2rem;flex-wrap:wrap;transition:background .4s}
.summary-item{text-align:center}
.summary-label{font-family:var(--font-heading);font-size:.55rem;text-transform:uppercase;color:var(--text-muted);letter-spacing:.08em;margin-bottom:.15rem}
.summary-val{font-family:var(--font-heading);font-size:1.35rem;font-weight:600;color:var(--text-primary)}

.refresh-bar{background:var(--bg-summary);border-bottom:1px solid var(--border-card);padding:.25rem 1.25rem;display:flex;align-items:center;gap:.75rem;transition:background .4s}
.refresh-label{font-family:var(--font-heading);font-size:.55rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.refresh-canvas{flex:1;height:32px}

.container{max-width:1400px;margin:0 auto;padding:1.25rem}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1.25rem}

.token-card{background:var(--bg-card);border:1px solid var(--border-card);border-radius:12px;padding:1.5rem 1.75rem;transition:all .3s;box-shadow:var(--shadow-card);position:relative;overflow:hidden}
.token-card:hover{background:var(--bg-card-hover);box-shadow:var(--shadow-glow)}
.token-card.flash-green{border-color:var(--positive)!important;box-shadow:0 0 12px rgba(46,204,113,.2)!important}
.token-card.flash-red{border-color:var(--negative)!important;box-shadow:0 0 12px rgba(231,76,60,.2)!important}

.card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem}
.card-identity{display:flex;align-items:center;gap:.75rem}
.token-logo{width:52px;height:52px;border-radius:50%;object-fit:cover;background:#000;flex-shrink:0;border:2px solid var(--border-card)}
.token-symbol{font-family:var(--font-heading);font-size:1.35rem;font-weight:700;color:var(--text-primary);letter-spacing:.05em}
.token-name{font-family:var(--font-body);font-size:.7rem;color:var(--text-muted);font-style:italic}

.price-area{text-align:right}
.price-main{font-family:var(--font-heading);font-size:2rem;font-weight:700;color:var(--text-primary);line-height:1.1}
.price-secondary{font-family:var(--font-body);font-size:.95rem;color:var(--text-muted);margin-top:.15rem}

.chart-section{margin-top:.75rem}
.chart-controls{display:flex;align-items:center;justify-content:space-between;margin-bottom:.4rem}
.chart-title{font-family:var(--font-heading);font-size:.6rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em}
.tf-buttons{display:flex;gap:.25rem}
.tf-btn{font-family:var(--font-heading);font-size:.6rem;font-weight:600;padding:.2rem .5rem;border-radius:4px;border:1px solid var(--border-card);background:transparent;color:var(--text-muted);cursor:pointer;transition:all .2s}
.tf-btn:hover{border-color:var(--qfs-gold);color:var(--qfs-gold)}
.tf-btn.active{background:rgba(209,180,123,.2);color:var(--qfs-gold);border-color:var(--qfs-gold)}
.sparkline-wrap{position:relative;height:80px;border-radius:6px;overflow:hidden}
.sparkline-wrap canvas{width:100%;height:100%;display:block}
.chart-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.4);color:var(--qfs-gold);font-family:var(--font-heading);font-size:.7rem;opacity:0;pointer-events:none;transition:opacity .2s;border-radius:6px}
.chart-loading.show{opacity:1}
[data-theme="light"] .chart-loading{background:rgba(255,255,255,.5)}
.chart-empty{font-family:var(--font-body);font-size:.7rem;color:var(--text-muted);text-align:center;padding:1.5rem 0;font-style:italic}

.toast-container{position:fixed;bottom:1rem;right:1rem;z-index:9000;display:flex;flex-direction:column;gap:.5rem}
.toast{background:var(--bg-toast);border:1px solid var(--border-card);border-radius:8px;padding:.6rem 1rem;font-family:var(--font-body);font-size:.7rem;color:var(--text-secondary);box-shadow:0 4px 12px rgba(0,0,0,.3);animation:toastIn .3s ease;max-width:280px}
.toast.error{border-left:3px solid var(--negative)}.toast.info{border-left:3px solid var(--qfs-gold)}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

@media(max-width:900px){.grid{grid-template-columns:1fr 1fr;gap:1rem}.token-card{padding:1.25rem}.price-main{font-size:1.6rem}.summary-bar{gap:1rem}}
@media(max-width:640px){.grid{grid-template-columns:1fr}.header{padding:.5rem .75rem}.header-title{font-size:1rem}.header-sub{display:none}.container{padding:.75rem}.token-card{padding:1rem 1.15rem}.price-main{font-size:1.4rem}.token-logo{width:44px;height:44px}.token-symbol{font-size:1.1rem}.sparkline-wrap{height:60px}.summary-val{font-size:1rem}.summary-bar{gap:.75rem;padding:.4rem .75rem}}
</style>
</head>
<body>

<div id="loader">
  <img src="qfs.png" alt="QFS" class="loader-logo">
  <div class="loader-title">QFS Token Feed</div>
  <div class="loader-spinner"></div>
  <div class="loader-sub">Connecting to XRPL&hellip;</div>
</div>

<header class="header">
  <div class="header-left">
    <img src="qfs.png" alt="QFS" class="header-logo">
    <div><div class="header-title">QFS Token Feed</div><div class="header-sub">Quantum Financial Systems</div></div>
  </div>
  <div class="header-right">
    <div class="conn-dot" id="conn-dot" title="Connection status"></div>
    <button class="btn-sm" id="btn-xrp" title="Show XRP prices">XRP</button>
    <button class="btn-sm active" id="btn-usd" title="Show USD prices">USD</button>
    <div class="theme-toggle" id="theme-toggle" title="Toggle light/dark mode">
      <span class="theme-icon moon">&#9790;</span><span class="theme-icon sun">&#9788;</span>
    </div>
  </div>
</header>

<div class="summary-bar">
  <div class="summary-item"><div class="summary-label">XRP / USD</div><div class="summary-val" id="sum-xrp">$&mdash;</div></div>
  <div class="summary-item"><div class="summary-label">Active Feeds</div><div class="summary-val" id="sum-feeds">0 / 6</div></div>
  <div class="summary-item"><div class="summary-label">Last Update</div><div class="summary-val" id="sum-time">&mdash;</div></div>
  <div class="summary-item"><div class="summary-label">Next Refresh</div><div class="summary-val" id="sum-countdown">&mdash;</div></div>
</div>

<div class="refresh-bar">
  <div class="refresh-label">Next Refresh</div>
  <canvas class="refresh-canvas" id="refresh-canvas"></canvas>
</div>

<div class="container"><div class="grid" id="card-grid"></div></div>
<div class="toast-container" id="toasts"></div>

<!-- XRPL.js library — same version as xSTIK tracker -->
<script src="https://unpkg.com/xrpl@3.0.0/build/xrpl-latest.js"></script>

<script>
/* ═══ CONFIG ═══ */
const TOKENS=[
  {symbol:'RPR',name:'Repare Pro Renata',currency:'RPR',issuer:'r3qWgpz2ry3BhcRJ8JE6rxM8esrfhuKp4R',color:'#C41E3A',logo:'rpr.png'},
  {symbol:'ASC',name:'Ascension',currency:'ASC',issuer:'r3qWgpz2ry3BhcRJ8JE6rxM8esrfhuKp4R',color:'#3A7BD5',logo:'asc.png'},
  {symbol:'ARK',name:'Ark',currency:'ARK',issuer:'rf5Jzzy6oAFBJjLhokha1v8pXVgYYjee3b',color:'#2ECC71',logo:'ark.png'},
  {symbol:'PLR',name:'PiLLARS',currency:'PLR',issuer:'rNSYhWLhuHvmURwWbJPBKZMSPsyG5Qek17',color:'#9B59B6',logo:'plr.png'},
  {symbol:'STX',name:'Strategy-X',currency:'STX',issuer:'rSTAYKxF2K77ZLZ8GoAwTqPGaphAqMyXV',color:'#E67E22',logo:'stx.png'},
  {symbol:'BOX',name:'BuiltOnXRP',currency:'BOX',issuer:'rhy4FUHtXrMZhbkBfeYvDv4nz6R7M4cu1t',color:'#1ABC9C',logo:'box.png'}
];

const XRPL_WS='wss://xrplcluster.com';
const CG_URL='https://api.coingecko.com/api/v3/simple/price?ids=ripple&vs_currencies=usd';
const SUPABASE_URL='https://wcnqphmvvjncjponpueo.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndjbnFwaG12dmpuY2pwb25wdWVvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIxMDEwNDEsImV4cCI6MjA4NzY3NzA0MX0.IATrnXhz01F76YYGoDVAJx3w9sjQyobCZvC7YZ3knPM';
const TABLE='qfs_prices';
const TICK=300000; // 5 min — matches collector

// Timeframes in minutes for Supabase history queries
const TIMEFRAMES={'1H':60,'4H':240,'1D':1440,'1W':10080};

/* ═══ STATE ═══ */
let client=null, xrpUsd=0, activeCur='usd', activeTf='1D';
const state=Object.fromEntries(TOKENS.map(t=>[t.symbol,{price:null,usd:null,history:[]}]));
let cdInt=null;

/* ═══ THEME ═══ */
(function(){const m=document.cookie.match(/qfs_theme=(\w+)/);if(m&&m[1]==='light')document.documentElement.setAttribute('data-theme','light')})();
function toggleTheme(){const h=document.documentElement,n=h.getAttribute('data-theme')==='dark'?'light':'dark';h.setAttribute('data-theme',n);document.cookie='qfs_theme='+n+';path=/;max-age=31536000;SameSite=Lax';TOKENS.forEach(t=>drawChart(t.symbol));drawRefreshBar()}

/* ═══ UTILS ═══ */
function fmt(n){if(n==null)return'\u2014';if(n>=1)return n.toFixed(4);if(n>=.01)return n.toFixed(5);if(n>=.0001)return n.toFixed(6);return n.toFixed(8)}
function fmtUsd(n){if(n==null)return'\u2014';if(n>=.01)return'$'+n.toFixed(4);if(n>=.0001)return'$'+n.toFixed(6);return'$'+n.toFixed(8)}
function showToast(m,type='info'){const c=document.getElementById('toasts'),el=document.createElement('div');el.className='toast '+type;el.textContent=m;c.appendChild(el);setTimeout(()=>{el.style.opacity='0';setTimeout(()=>el.remove(),400)},4000)}
function updateConn(s){document.getElementById('conn-dot').className='conn-dot '+s}

/* ═══ XRP/USD ═══ */
async function fetchXrpUsd(){
  try{const r=await fetch(CG_URL);if(r.ok){const d=await r.json();xrpUsd=d?.ripple?.usd||0}}catch(e){}
  document.getElementById('sum-xrp').textContent=xrpUsd?'$'+xrpUsd.toFixed(4):'$\u2014';
}

/* ═══ XRPL LIVE PRICE (same method as xSTIK tracker) ═══ */
async function fetchLivePrice(token){
  if(!client||!client.isConnected())return null;
  const tryBook=async(gets,pays)=>{try{const r=await client.request({command:'book_offers',taker_gets:gets,taker_pays:pays,limit:5});return r.result?.offers??[]}catch{return[]}};

  // Side A: selling XRP for token
  const A=await tryBook({currency:'XRP'},{currency:token.currency,issuer:token.issuer});
  if(A.length){const b=A[0];const xD=typeof b.TakerGets==='string'?+b.TakerGets:(+b.TakerGets?.value??0)*1e6;const tA=typeof b.TakerPays==='string'?+b.TakerPays:+b.TakerPays?.value??0;if(tA>0)return(xD/1e6)/tA}

  // Side B: selling token for XRP
  const B=await tryBook({currency:token.currency,issuer:token.issuer},{currency:'XRP'});
  if(B.length){const b=B[0];const tA=typeof b.TakerGets==='string'?+b.TakerGets:+b.TakerGets?.value??0;const xD=typeof b.TakerPays==='string'?+b.TakerPays:(+b.TakerPays?.value??0)*1e6;if(tA>0)return(xD/1e6)/tA}

  return null;
}

/* ═══ SUPABASE HISTORY ═══ */
async function fetchHistory(symbol,minutes){
  const since=new Date(Date.now()-minutes*60*1000).toISOString();
  const url=`${SUPABASE_URL}/rest/v1/${TABLE}?select=fetched_at,price_xrp,price_usd&symbol=eq.${symbol}&fetched_at=gte.${since}&order=fetched_at.asc&limit=500`;
  try{const r=await fetch(url,{headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`}});if(!r.ok)return[];return await r.json()}catch{return[]}
}

async function loadAllHistory(){
  const mins=TIMEFRAMES[activeTf];
  for(const t of TOKENS){
    const rows=await fetchHistory(t.symbol,mins);
    state[t.symbol].history=rows;
  }
}

/* ═══ RENDER CARDS ═══ */
function renderCards(){
  const grid=document.getElementById('card-grid');grid.innerHTML='';
  TOKENS.forEach(t=>{
    const card=document.createElement('div');card.className='token-card';card.id='card-'+t.symbol;
    card.innerHTML=`
      <div class="card-top">
        <div class="card-identity">
          <img src="${t.logo}" alt="${t.symbol}" class="token-logo" onerror="this.onerror=null;this.style.background='${t.color}';this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 48 48%22%3E%3Ctext x=%2224%22 y=%2232%22 font-size=%2220%22 fill=%22white%22 text-anchor=%22middle%22 font-family=%22sans-serif%22%3E${t.symbol.charAt(0)}%3C/text%3E%3C/svg%3E'">
          <div><div class="token-symbol">${t.symbol}</div><div class="token-name">${t.name}</div></div>
        </div>
        <div class="price-area">
          <div class="price-main" id="p-${t.symbol}">\u2014</div>
          <div class="price-secondary" id="ps-${t.symbol}"></div>
        </div>
      </div>
      <div class="chart-section">
        <div class="chart-controls">
          <span class="chart-title">Price Chart</span>
          <div class="tf-buttons" id="tf-group-${t.symbol}">
            ${Object.keys(TIMEFRAMES).map(k=>`<button class="tf-btn${k===activeTf?' active':''}" data-tf="${k}" onclick="switchTimeframe('${k}')">${k}</button>`).join('')}
          </div>
        </div>
        <div class="sparkline-wrap"><canvas id="sp-${t.symbol}"></canvas><div class="chart-loading" id="cl-${t.symbol}">Loading&hellip;</div></div>
        <div class="chart-empty" id="ce-${t.symbol}" style="display:none">Collecting data &mdash; chart will appear soon</div>
      </div>`;
    grid.appendChild(card);
  });
}

/* ═══ UPDATE CARD PRICES ═══ */
function renderCard(token){
  const s=state[token.symbol];
  const pEl=document.getElementById('p-'+token.symbol);
  const psEl=document.getElementById('ps-'+token.symbol);
  if(!pEl)return;

  if(s.price!=null){
    if(activeCur==='xrp'){
      pEl.textContent=fmt(s.price)+' XRP';
      psEl.textContent=s.usd!=null?fmtUsd(s.usd):'';
    }else{
      pEl.textContent=s.usd!=null?fmtUsd(s.usd):'\u2014';
      psEl.textContent=fmt(s.price)+' XRP';
    }
  }else{
    pEl.textContent='\u2014';
    psEl.textContent='';
  }

  // Chart from Supabase history
  const hist=s.history;
  const ceEl=document.getElementById('ce-'+token.symbol);
  const spEl=document.getElementById('sp-'+token.symbol);
  if(hist.length<2){
    if(ceEl)ceEl.style.display='block';
    if(spEl)spEl.parentElement.style.display='none';
  }else{
    if(ceEl)ceEl.style.display='none';
    if(spEl)spEl.parentElement.style.display='block';
    drawChart(token.symbol);
  }
}

/* ═══ CHART DRAWING ═══ */
function drawChart(sym){
  const cv=document.getElementById('sp-'+sym);if(!cv)return;
  const r=cv.parentElement.getBoundingClientRect();if(r.width===0)return;
  const dpr=window.devicePixelRatio||1;cv.width=r.width*dpr;cv.height=r.height*dpr;
  const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);const w=r.width,h=r.height;ctx.clearRect(0,0,w,h);

  const hist=state[sym].history;
  const data=hist.map(row=>activeCur==='xrp'?parseFloat(row.price_xrp):(row.price_usd?parseFloat(row.price_usd):parseFloat(row.price_xrp)*xrpUsd)).filter(v=>v>0);
  if(data.length<2)return;

  const tok=TOKENS.find(t=>t.symbol===sym),color=tok?tok.color:'#D1B47B';
  const mn=Math.min(...data),mx=Math.max(...data),rng=mx-mn||1,pad=4;

  const gc=getComputedStyle(document.documentElement).getPropertyValue('--chart-grid').trim();
  ctx.strokeStyle=gc;ctx.lineWidth=.5;
  for(let i=1;i<4;i++){const y=pad+(h-2*pad)*i/4;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}

  const grd=ctx.createLinearGradient(0,0,0,h);grd.addColorStop(0,color+'30');grd.addColorStop(1,color+'00');
  ctx.beginPath();data.forEach((v,i)=>{const x=i/(data.length-1)*w,y=pad+(1-(v-mn)/rng)*(h-2*pad);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y)});
  ctx.lineTo(w,h);ctx.lineTo(0,h);ctx.closePath();ctx.fillStyle=grd;ctx.fill();

  ctx.beginPath();data.forEach((v,i)=>{const x=i/(data.length-1)*w,y=pad+(1-(v-mn)/rng)*(h-2*pad);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y)});
  ctx.strokeStyle=color;ctx.lineWidth=1.5;ctx.stroke();

  const ly=pad+(1-(data[data.length-1]-mn)/rng)*(h-2*pad);
  ctx.beginPath();ctx.arc(w,ly,3,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();
}

/* ═══ TIMEFRAME SWITCH ═══ */
async function switchTimeframe(tfKey){
  activeTf=tfKey;
  // Update all tf buttons on all cards
  document.querySelectorAll('.tf-btn').forEach(b=>b.classList.toggle('active',b.getAttribute('data-tf')===tfKey));
  // Show loading on all charts
  TOKENS.forEach(t=>{const cl=document.getElementById('cl-'+t.symbol);if(cl)cl.classList.add('show')});
  await loadAllHistory();
  TOKENS.forEach(t=>{const cl=document.getElementById('cl-'+t.symbol);if(cl)cl.classList.remove('show');renderCard(t)});
}

/* ═══ CURRENCY SWITCH ═══ */
function switchCurrency(cur){
  activeCur=cur;
  document.getElementById('btn-xrp').classList.toggle('active',cur==='xrp');
  document.getElementById('btn-usd').classList.toggle('active',cur==='usd');
  TOKENS.forEach(t=>renderCard(t));
}

/* ═══ FETCH ALL LIVE PRICES ═══ */
async function fetchAll(){
  let feeds=0;
  for(const token of TOKENS){
    const price=await fetchLivePrice(token);
    const s=state[token.symbol];
    const prev=s.price;
    s.price=price;
    s.usd=(price!=null&&xrpUsd>0)?price*xrpUsd:null;

    if(price!=null)feeds++;

    // Flash on price change
    const card=document.getElementById('card-'+token.symbol);
    if(card&&prev!=null&&price!=null&&price!==prev){
      card.classList.remove('flash-green','flash-red');
      void card.offsetWidth;
      card.classList.add(price>prev?'flash-green':'flash-red');
      setTimeout(()=>card.classList.remove('flash-green','flash-red'),800);
    }
    renderCard(token);
    await new Promise(r=>setTimeout(r,300)); // small delay between requests
  }
  document.getElementById('sum-feeds').textContent=feeds+' / 6';
  document.getElementById('sum-time').textContent=new Date().toLocaleTimeString();
}

/* ═══ REFRESH BAR — SINE WAVE ONLY ═══ */
let refreshInterval=null,refreshStart=0;
function startRefreshCycle(){
  refreshStart=Date.now();
  if(refreshInterval)clearInterval(refreshInterval);
  refreshInterval=setInterval(drawRefreshBar,50);
}
function drawRefreshBar(){
  const cv=document.getElementById('refresh-canvas');if(!cv)return;
  const r=cv.getBoundingClientRect();if(r.width===0)return;
  const dpr=window.devicePixelRatio||1;cv.width=r.width*dpr;cv.height=r.height*dpr;
  const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);const w=r.width,h=r.height;ctx.clearRect(0,0,w,h);
  const p=Math.min((Date.now()-refreshStart)/TICK,1);
  const t=Date.now()/1000,gold='#D1B47B',green='#7AA7A0';

  [{c:gold+'60',f:3,a:.3,ph:0},{c:green+'60',f:4,a:.25,ph:1},{c:gold+'30',f:5,a:.2,ph:2}].forEach(wv=>{
    ctx.beginPath();ctx.strokeStyle=wv.c;ctx.lineWidth=1.5;
    for(let x=0;x<=w*p;x++){const y=h/2+Math.sin(x/w*Math.PI*2*wv.f+t*2+wv.ph)*h*wv.a;x===0?ctx.moveTo(x,y):ctx.lineTo(x,y)}
    ctx.stroke();
  });
  ctx.beginPath();ctx.arc(p*w,h/2,4,0,Math.PI*2);ctx.fillStyle=gold;ctx.fill();

  // Countdown
  const rem=Math.max(0,Math.ceil((TICK-(Date.now()-refreshStart))/1000));
  document.getElementById('sum-countdown').textContent=rem>=60?Math.ceil(rem/60)+'m':rem+'s';

  if(p>=1){triggerRefresh();startRefreshCycle()}
}

/* ═══ REFRESH ═══ */
async function triggerRefresh(){
  await fetchXrpUsd();
  await loadAllHistory();
  await fetchAll();
}

/* ═══ INIT ═══ */
function dismissLoader(){const el=document.getElementById('loader');if(el){el.classList.add('hidden');setTimeout(()=>el.style.display='none',600)}}

async function init(){
  renderCards();
  // Hard timeout — loader gone in 8 seconds no matter what
  setTimeout(()=>dismissLoader(),8000);

  // Load history + XRP/USD + XRPL connect in parallel
  await Promise.all([
    loadAllHistory(),
    fetchXrpUsd(),
    (async()=>{
      try{
        updateConn('connecting');
        client=new xrpl.Client(XRPL_WS);
        await client.connect();
        updateConn('live');
      }catch(e){
        updateConn('rest');
        showToast('XRPL connection failed — retrying...','error');
      }
    })()
  ]);

  dismissLoader();

  // Render charts from history
  TOKENS.forEach(t=>renderCard(t));

  // Fetch live prices from XRPL DEX
  await fetchAll();

  // Start refresh cycle
  startRefreshCycle();

  // Auto-refresh every 5 min
  setInterval(async()=>{
    await loadAllHistory();
    await fetchAll();
    await fetchXrpUsd();
  },TICK);

  // XRPL reconnect handler
  if(client){
    client.on('disconnected',()=>{
      updateConn('rest');
      setTimeout(async()=>{
        try{await client.connect();updateConn('live')}catch(e){updateConn('rest')}
      },5000);
    });
  }
}

/* ═══ EVENTS ═══ */
document.getElementById('btn-usd').addEventListener('click',()=>switchCurrency('usd'));
document.getElementById('btn-xrp').addEventListener('click',()=>switchCurrency('xrp'));
document.getElementById('theme-toggle').addEventListener('click',toggleTheme);
let rT;window.addEventListener('resize',()=>{clearTimeout(rT);rT=setTimeout(()=>TOKENS.forEach(t=>drawChart(t.symbol)),200)});
window.switchTimeframe=switchTimeframe;
window.addEventListener('beforeunload',()=>{if(client?.isConnected())client.disconnect().catch(()=>{})});

init();
</script>
